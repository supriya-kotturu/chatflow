services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: chatflow
      RABBITMQ_DEFAULT_PASS: chatflow-pwd
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: chatflow-pwd
      POSTGRES_DB: chatflow
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatflow -d chatflow"]
      interval: 5s
      timeout: 3s
      retries: 5
